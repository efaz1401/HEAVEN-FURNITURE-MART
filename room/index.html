<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to your cart — Heaven Furniture Mart</title>
<!-- This page WAS the room board, then the order request sheet. It is now the
     cart, at /cart/. The directory stays as a redirect rather than a 404 because
     the URL is in the wild: the old sitemap listed it, the footer linked to it,
     and anyone who bookmarked their board would otherwise land on nothing.

     Three redirects, deliberately layered, because each covers a case the others
     miss:
       .htaccess  a real 301 on Apache/LiteSpeed — what search engines need, and
                  what actually runs on the host
       meta       covers any server without .htaccess support, and the local dev
                  server, which does no rewriting at all
       <a>        covers a browser that honours neither, and is what a reader
                  sees if the redirect is slow
     canonical points at /cart/ so the two URLs never compete. -->
<meta http-equiv="refresh" content="0; url=../cart/">
<link rel="canonical" href="https://yourfirstsite.com/cart/">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#111219">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="../assets/fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/fonts.generated.css?v=60">
<link rel="stylesheet" href="../css/tokens.css?v=60">
<link rel="stylesheet" href="../css/base.css?v=60">
<link rel="stylesheet" href="../css/pages.css?v=60">
<link rel="stylesheet" href="../css/experience.css?v=60">
<link rel="stylesheet" href="../css/nav.css?v=60">
<!-- modulepreload: generated by scripts/add-modulepreload.mjs -->
<link rel="modulepreload" href="../data/i18n.js">
<link rel="modulepreload" href="../data/pieces.js">
<link rel="modulepreload" href="../js/magnetic.js">
<link rel="modulepreload" href="../js/menu.js">
<link rel="modulepreload" href="../js/order.js">
<link rel="modulepreload" href="../js/pricing.js">
<link rel="modulepreload" href="../js/search.js">
<link rel="modulepreload" href="../js/shell.js">
<!-- /modulepreload -->
</head>
<body data-depth="1">
<main id="main">
  <section style="padding-block:6rem var(--section)">
    <div class="wrap wrap--narrow center">
      <h1>Your cart has moved</h1>
      <p class="lead center" style="max-width:44ch">The room board is now your cart, with prices
      and quantities.</p>
      <p style="margin-top:2rem"><a class="btn" href="../cart/">Go to your cart</a></p>
    </div>
  </section>
</main>
<script type="module" src="../js/chrome.js"></script>
</body>
</html>
